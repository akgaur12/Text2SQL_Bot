<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLify | Text to SQL</title>
    <!-- Anti-flicker script -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme + '-mode');
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script type="module" src="https://md-block.verou.me/md-block.js"></script>
</head>

<body>
    <header>
        <div class="header-left">
            <h1>SQLify</h1>
        </div>
        <div class="header-actions">
            <button class="darkModeButton" id="toggleTheme" title="Toggle Theme">🌙</button>
            <a href="{{ url_for('about') }}" title="About SQLify">
                <img src="{{ url_for('static', filename='info_light.png') }}" alt="Info" class="logo"
                    data-light="{{ url_for('static', filename='info_light.png') }}"
                    data-dark="{{ url_for('static', filename='info_dark.png') }}">
            </a>
        </div>
    </header>

    <div class="chat-container">
        <div id="chat-box" class="chat-box">
            <!-- Messages will appear here -->
        </div>
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="Ask anything about your data..." autocomplete="off">
            <button class="sendButton" id="send-button">
                <span class="button-text">Send</span>
                <div class="spinner"></div>
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
